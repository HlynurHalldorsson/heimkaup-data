name: Heimkaup Inventory Tracker

on:
  # The real schedule is a Vercel cron in heimkaup-inventory that dispatches
  # this workflow every 30 min. GitHub's own scheduler is kept only as a
  # fallback: it ran 2-5 of the intended 22 runs a day, hours late.
  schedule:
    - cron: '0,30 11-21 * * *'  # Every 30 min, 11:00-21:30 UTC (= Iceland time, no DST)
  workflow_dispatch:              # Vercel cron, or manual trigger from GitHub UI

# Each run reads the previous state, appends to it, and writes it back. Git used
# to reject an overlapping second push as a non-fast-forward; the blob store has
# no such protection, so a manual dispatch landing on top of a scheduled run
# would silently drop one run's history points. Never run two at once.
concurrency:
  group: inventory-tracker
  cancel-in-progress: false

jobs:
  track-inventory:
    runs-on: ubuntu-latest

    # Tracker output goes to the Vercel Blob store, not back into this repo, so
    # the job no longer needs write access to repository contents.
    permissions:
      contents: read

    env:
      BLOB_BASE_URL: https://e86ievr4hliy7xl4.public.blob.vercel-storage.com
      DATA_DIR: tracker-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install requests
          npm install --no-save @vercel/blob

      # Reads previous state from the public store, then stages only the files
      # that changed into $DATA_DIR along with _upload_manifest.json.
      - name: Run inventory tracker
        run: |
          mkdir -p "$DATA_DIR"
          python3 heimkaup_inventory_tracker.py \
            --data-dir "$DATA_DIR" \
            --blob-base "$BLOB_BASE_URL"

      # Runs even when the tracker step failed: each warehouse is processed
      # independently, so one location's API failure still leaves the others'
      # data staged. The job stays red either way.
      - name: Upload changed data to Blob
        if: ${{ !cancelled() }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node upload_blobs.mjs "$DATA_DIR"

      # Optional: set the SLACK_WEBHOOK_URL secret to get a message when a run
      # fails. Without it GitHub still emails the person who triggered the run.
      - name: Alert on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack alert"
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: Heimkaup inventory tracker run failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
